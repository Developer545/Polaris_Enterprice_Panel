<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS DTE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 400px;
      height: 240px;
      overflow: hidden;
      background: #0f0f0f;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo-icon {
      width: 52px;
      height: 52px;
      background: #f47920;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      letter-spacing: -1px;
      box-shadow: 0 4px 20px rgba(244,121,32,0.5);
    }

    .logo-text h1 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }

    .logo-text p {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
    }

    .progress-bar {
      width: 220px;
      height: 3px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #f47920, #ff9a4d);
      border-radius: 2px;
      animation: slide 1.4s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); width: 40%; }
      50%  { width: 70%; }
      100% { transform: translateX(300%); width: 40%; }
    }

    .status {
      font-size: 11px;
      color: #555;
      letter-spacing: 0.5px;
    }

    .version {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 10px;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <div class="logo-icon">POS</div>
    <div class="logo-text">
      <h1>POS DTE</h1>
      <p>Speeddan System · El Salvador</p>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill"></div>
  </div>
  <div class="status" id="status">Iniciando...</div>

  <div class="version" id="ver">v1.0.0</div>

  <script>
    // Receive status messages from main process via window.name trick
    // (no nodeIntegration needed — main writes to title)
    const messages = ['Iniciando...', 'Verificando conexion...', 'Cargando aplicacion...']
    let i = 0
    const el = document.getElementById('status')
    setInterval(() => {
      i = (i + 1) % messages.length
      el.textContent = messages[i]
    }, 900)

    // Show version from title tag (main sets document.title via webContents)
    const verEl = document.getElementById('ver')
    const obs = new MutationObserver(() => {
      if (document.title && document.title !== 'POS DTE') {
        verEl.textContent = document.title
      }
    })
    obs.observe(document.querySelector('title'), { childList: true })
  </script>
</body>
</html>
