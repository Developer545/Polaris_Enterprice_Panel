appId: com.speeddan.posdte
productName: POS DTE El Salvador
copyright: Copyright © 2025 Speeddan System

# Deshabilitar rebuild de nativos — serialport usa binarios precompilados
nodeGypRebuild: false
npmRebuild: false

directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - "!**/*.map"
  - "!**/*.pdb"

# Extraer nativos del ASAR para que carguen correctamente
asarUnpack:
  - node_modules/@serialport/**
  - node_modules/serialport/**
  - node_modules/node-thermal-printer/**

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  language: 3082

publish:
  provider: github
  owner: Developer545
  repo: pos-dte-releases

protocols:
  - name: POS DTE
    schemes: [pos-dte]
