appId: com.speeddan.polaris
productName: Polaris
artifactName: "Polaris-Cloud-${version}-${os}-${arch}.${ext}"
copyright: Copyright © 2025 Speeddan System
electronVersion: "42.1.0"
electronDist: "../../node_modules/electron/dist"

# Deshabilitar rebuild de nativos — serialport usa binarios precompilados
nodeGypRebuild: false
npmRebuild: false

directories:
  output: release
  buildResources: resources

files:
  - bootstrap.cjs
  - dist/**/*
  - "!**/*.map"
  - "!**/*.pdb"

# Extraer nativos del ASAR para que carguen correctamente
asarUnpack:
  - node_modules/@serialport/**
  - node_modules/serialport/**
  - node_modules/node-thermal-printer/**

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  language: 3082

publish:
  provider: github
  owner: Developer545
  repo: polaris-releases

protocols:
  - name: Polaris Enterprise
    schemes: [polaris]
