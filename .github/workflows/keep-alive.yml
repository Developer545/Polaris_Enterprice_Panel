name: Keep Alive

on:
  schedule:
    # Every 14 minutes — prevents Render free plan from sleeping (15min timeout)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ping API health
        run: |
          curl -sf --max-time 30 https://polaris-enterprice-panel.onrender.com/api/health || echo "API unreachable (cold start expected)"
