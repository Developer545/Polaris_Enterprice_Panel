services:
  - type: web
    name: polaris-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci && npm run build --workspace=apps/api
    startCommand: node apps/api/dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CONTROL_PLANE_DATABASE_URL
        sync: false
      - key: SHARED_TENANT_DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ADMIN_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      - key: ENCRYPTION_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: polaris-redis
          property: connectionString

  - type: redis
    name: polaris-redis
    region: oregon
    plan: free
    maxmemoryPolicy: noeviction
