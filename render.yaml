services:
  - type: web
    name: polaris-api
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci --include=dev && cd packages/db && npx prisma generate --schema prisma/control-plane.prisma && npx prisma generate --schema prisma/tenant.prisma && cd ../../packages/shared-types && npm run build && cd ../dte-core && npm run build && cd ../.. && npm run build --workspace=apps/api
    startCommand: node apps/api/dist/main
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # ── Neon PostgreSQL ──────────────────────────────────────
      - key: CONTROL_PLANE_DATABASE_URL
        sync: false
      - key: SHARED_TENANT_DATABASE_URL
        sync: false
      # ── JWT ──────────────────────────────────────────────────
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ADMIN_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES
        value: 7d
      # ── Seguridad ────────────────────────────────────────────
      - key: ENCRYPTION_KEY
        sync: false
      - key: LICENSE_HMAC_SECRET
        sync: false
      - key: LICENSE_EC_PRIVATE_KEY_B64
        sync: false
      # ── CORS / URLs ──────────────────────────────────────────
      - key: CORS_ORIGINS
        sync: false
      # ── Redis (Upstash recomendado) ──────────────────────────
      - key: REDIS_URL
        sync: false
      # ── Cloudinary ───────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # ── Email (Resend) ───────────────────────────────────────
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: noreply@speeddan.com
      # ── GitHub releases (Electron updater) ───────────────────
      - key: GITHUB_TOKEN
        sync: false
